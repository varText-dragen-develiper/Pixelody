<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-label="Original layered hanami room with sakura branch">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f1719"/>
      <stop offset=".42" stop-color="#26372d"/>
      <stop offset=".72" stop-color="#314c3e"/>
      <stop offset="1" stop-color="#9fa895"/>
    </linearGradient>
    <linearGradient id="screen-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4efe3" stop-opacity=".72"/>
