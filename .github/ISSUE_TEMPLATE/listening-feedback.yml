name: Listening and setup feedback
description: Tell me what would make listening or getting started easier.
title: "[Feedback]: "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for giving it a try. Tell me what you were trying to do and where it got awkward.
        Please leave private library details out of this public report.
  - type: input
    id: build
    attributes:
      label: Platform, device and app version
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What were you trying to do?
      description: Tell me how you were listening and what you wanted to do next.
    validations:
      required: true
  - type: textarea
    id: obstacle
    attributes:
      label: The first confusing or difficult step
    validations:
      required: true
  - type: textarea
    id: improvement
    attributes:
      label: What would make this easier?
      description: Suggestions are welcome. Please keep private library details out of public reports.
